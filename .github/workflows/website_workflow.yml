name: Website

# Run only on changes in the "website" directory or workflow file.
# Skip the release branches, since the website is built from main.

on:

  push:
    branches:-ignore:
      - RB-*
    paths:
      - 'website/**'
      - '.github/workflows/website_workflow.yml'
      
  pull_request:
    branches:-ignore:
      - RB-*
    paths:
      - 'website/**'
      - '.github/workflows/website_workflow.yml'

permissions:
  contents: read

jobs:

  Website:

    # Build the website, using a process that mimics the readthedoc build.
    
    name: 'Website'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Create build directory
        run: mkdir _build
      - name: Install doxygen 
        run: sudo apt-get install -y doxygen
      - name: Install sphinx requirements
        run: |
          python3 -m venv _venv
          source _venv/*/activate
          pip3 install --require-hashes -r ../website/requirements-lock.txt
        working-directory: _build
        shell: bash
      - name: Configure
        run: 
          cmake .. -DBUILD_WEBSITE=ON -DCMAKE_VERBOSE_MAKEFILE=ON -DSPHINX_OPTS=""
        working-directory: _build
      - name: Build
        run: |
          cmake --build . \
                --target website \
                --config Release
        working-directory: _build
    
